# AI LAB 자동 배포
#
# main 브랜치에 코드가 올라가면 GitHub 이 알아서 빌드해서 웹에 올려 줍니다.
# 선생님 컴퓨터에서 npm run build 를 하실 필요가 없습니다.
#
# 이 파일이 저장소의 다음 위치에 있어야 합니다.
#   .github/workflows/deploy.yml
#
# 처음 한 번만 설정하면 됩니다.
#   저장소 → Settings → Pages → Source 를 "GitHub Actions" 로 선택

name: 배포

on:
  push:
    branches: [main]
  # 저장소의 Actions 탭에서 직접 눌러 실행할 수도 있습니다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 반영합니다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 알고리즘 검증
        run: npm run verify

      - name: 화면 렌더링 점검
        run: npm run smoke

      - name: 빌드
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
